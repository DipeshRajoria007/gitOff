name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20.19', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the server
        shell: bash
        run: |
          export GITOFF_HOME="$RUNNER_TEMP/gitoff" GITOFF_OFFLINE=1
          node bin/gitoff.mjs serve --no-open --port 4999 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4999/api/status > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4999/api/status
          curl -sf http://localhost:4999/ | grep -q '<title>gitOff</title>'
          node bin/gitoff.mjs status
          node bin/ogh.mjs --help > /dev/null
          cat "$RUNNER_TEMP/serve.log"
